<!doctype html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <meta name="author" content="Milo Wearn">
        <title>CE_Contacts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        
        <table>
            <tr>
                <th>Slot #</th>
                <th>Contact Name</th>
            </tr>
            <tr>
                <td>0</td>
                <td id = "a0">Arnold</td>
            </tr>
            <tr>
                <td>1</td>
                <td id = "a1">Sly</td>
            </tr>
            <tr>
                <td>2</td>
                <td id = "a2">Dwayne</td>
            </tr>
            <tr>
                <td>3</td>
                <td id = "a3">Vin</td>
            </tr>
            <tr>
                <td>4</td>
                <td id = "a4">JVCD</td>
            </tr>
            <tr>
                <td>5</td>
                <td id = "a5">Steven</td>
            </tr>
        </table>
        <!-- this will update when the user enters n when prompted with looping -->
        <p id = "endmessage"></p>
        <script>
            // i planned on having the table update automatically depending on what was in this array, but
            // it doesn't look like i can get the html to update before everything else starts.
            
            // setting up table...
            /* 
            const contacts = ["Arnold", "Sly", "Dwayne", "Vin", "JCVD", "Steven"];
            const ids = ["a0", "a1", "a2", "a3", "a4", "a5"];
            for (let i = 0; i < 6; i++) {
                document.getElementById(ids[i]).innerHTML = (contacts[i]);
            }
            */

            // this will make it so that the script will run AFTER the html is rendered.
            window.addEventListener('load', function () {
                const contacts = ["Arnold", "Sly", "Dwayne", "Vin", "JCVD", "Steven"];
                let loop = "y";
                while(loop == "y") {
                    let userEntryInput = prompt("Enter an entry number.");
                    if (userEntryInput >= 0 && userEntryInput <= contacts.length-1) { // raise ceiling (currently 5) if you want to add more contacts.
                        loop = prompt("Displaying " + contacts[userEntryInput] + "\nDo you want to make another selection? (y/n)");
                    } else if (userEntryInput == "") {
                        loop = prompt("That entry is not in the database.\nDo you want to make another selection? (y/n)");
                    } else {
                        loop = prompt("That entry is not in the database.\nDo you want to make another selection? (y/n)");
                    }
                    while (loop != "n" && loop != "y") {
                        loop = prompt("Please enter a valid input.\nDo you want to make another selection? (y/n)");
                    }
                }
                // display the end message.
                document.getElementById("endmessage").innerHTML = ("Thank you for using this program!");
            });
        </script>
    </body>
</html>
